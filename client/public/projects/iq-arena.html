<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQ Arena — اختبار الذكاء</title><style>body{margin:0;background:#0a1220;color:#eef3f8;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(760px,90vw);padding:34px;border:1px solid #31445d;border-radius:24px;background:linear-gradient(145deg,#132238,#0d1726);box-shadow:0 28px 80px #0008}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #31445d;padding-bottom:20px}h1{margin:0;color:#d7b976;font-size:28px}small{color:#aebbc9}.progress{height:7px;background:#24364d;border-radius:99px;margin:24px 0}.bar{height:100%;width:33%;background:#d7b976;border-radius:99px;transition:.3s}.question{font-size:22px;line-height:1.7;margin:28px 0}.answers{display:grid;gap:12px}.answers button,.next{border:1px solid #3b526d;background:#172b43;color:#eef3f8;border-radius:14px;padding:15px;text-align:right;font-size:16px;cursor:pointer;transition:.2s}.answers button:hover,.answers button.active{border-color:#d7b976;background:#253d5d}.next{display:block;margin-top:22px;background:#d7b976;color:#0a1220;text-align:center;font-weight:bold}.result{text-align:center;padding:35px 0}.result strong{display:block;font-size:60px;color:#d7b976;margin:16px}</style></head><body><main class="app"><header><div><small>Assessment · Gamification</small><h1>IQ Arena</h1></div><small id="count">01 / 03</small></header><div class="progress"><div class="bar" id="bar"></div></div><section id="quiz"></section></main><script>const qs=[{q:'ما الرقم التالي؟ 2، 4، 8، 16، ؟',a:['18','24','32','36'],c:2},{q:'إذا كانت كل الورود زهورًا، وبعض الزهور حمراء، فهل كل الورود حمراء؟',a:['نعم','لا يمكن الجزم','لا','دائمًا'],c:1},{q:'أي كلمة لا تنتمي إلى المجموعة؟',a:['مثلث','مربع','دائرة','مكعب'],c:3}];let i=0,score=0,choice=-1;const quiz=document.getElementById('quiz');function render(){choice=-1;document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / 03';document.getElementById('bar').style.width=((i+1)/qs.length*100)+'%';quiz.innerHTML='<div class="question">'+qs[i].q+'</div><div class="answers">'+qs[i].a.map((x,n)=>'<button onclick="pick('+n+',this)">'+x+'</button>').join('')+'</div><button class="next" onclick="next()">التالي ←</button>'}window.pick=(n,el)=>{choice=n;document.querySelectorAll('.answers button').forEach(b=>b.classList.remove('active'));el.classList.add('active')};window.next=()=>{if(choice<0)return;if(choice===qs[i].c)score++;i++;if(i<qs.length)render();else quiz.innerHTML='<div class="result"><small>نتيجتك في IQ Arena</small><strong>'+score+' / 3</strong><p>اختبار ذكاء تفاعلي قصير</p><button class="next" onclick="i=0;score=0;render()">إعادة الاختبار</button></div>'};render();</script></body></html>
